name: Bug report
description: parda broke a tool, crashed, or install/uninstall did something unexpected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use made-up data in everything you paste here."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Which AI tool and version?
      placeholder: "Claude Code 2.1.300"
  - type: textarea
    id: status
    attributes:
      label: Output of `parda status`
      render: text
  - type: textarea
    id: log
    attributes:
      label: Matching lines from ~/.parda/log.jsonl (they hold no values)
      render: text
  - type: input
    id: version
    attributes:
      label: parda version and OS
      placeholder: "parda 0.1.0, macOS 26 (Apple silicon)"
    validations:
      required: true
